name: ci

on:
  push:
    branches:
      - main
      - renovate/*
    tags:
      - v*
    paths-ignore:
      - renovate.json
      - "**.md"
      - Dockerfile
  pull_request:
    branches:
      - main
    paths-ignore:
      - renovate.json
      - "**.md"
      - Dockerfile

jobs:
  mypy:
    runs-on: ubuntu-26.04
    steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        - name: "Install Pixi"
          uses: prefix-dev/setup-pixi@v0.11.3
          with:
            pixi-version: "v0.84.1"
        - name: Install dependencies
          run: pixi install -e dev
        - run: |
            pixi run -e dev mypy app
  test:
    runs-on: ubuntu-26.04
    services:
      mongo:
        image: mongo:9
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: 12345
          MONGODUMP_DIR: /mongodumps
        volumes:
          - ${{ github.workspace }}/mongodumps:/mongodumps
        ports:
          - 27017:27017
        options: --name mongo
    defaults:
      run:
        working-directory: "."

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: "Install Pixi"
      uses: prefix-dev/setup-pixi@v0.11.3
      with:
        pixi-version: "v0.84.1"
    - name: Install dependencies
      run: pixi install -e dev
    - name: Populate mongodb data
      run: |
        sudo mkdir -p ${{ github.workspace }}/mongodumps
        sudo cp -r tests/test-data/minimongodumps/* ${{ github.workspace }}/mongodumps/
    - name: "Populate test catalog"
      uses: docker://docker
      with:
        args: >
          docker exec mongo /mongodumps/restore.sh
    - name: Start uvicorn server
      run: |
        export ROOT_PATH=/api/catalogmatch
        export MONGO_URI=mongodb://root:12345@localhost:27017
        export CATSHTM_DIR=${{ github.workspace }}/tests/test-data/catsHTM2
        export PYTHONPATH=${{ github.workspace }}
        nohup pixi run -e dev uvicorn app.main:app \
          --host 0.0.0.0 \
          --port 8000 \
          --workers 2 \
          > uvicorn.log 2>&1 &
        UVICORN_PID=$!
        echo "UVICORN_PID=$UVICORN_PID" >> $GITHUB_ENV
        # Wait for server to start and verify it's responsive
        sleep 5
        curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/catalogmatch/ || exit 1
    - name: Test with pytest
      run: |
        pixi run -e dev pytest tests --integration
      env:
        CATALOGSERVER_URI: http://localhost:8000/api/catalogmatch
        MONGO_URI: mongodb://root:12345@localhost:27017
    - name: Dump uvicorn logs on failure
      if: failure()
      run: cat uvicorn.log || true
    - name: Stop uvicorn server
      if: always()
      run: kill ${UVICORN_PID} || true
