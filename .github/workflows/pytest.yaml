name: ci

on:
  push:
    branches:
      - main
      - renovate/*
    tags:
      - v*
    paths-ignore:
      - renovate.json
      - "**.md"
      - Dockerfile
  pull_request:
    branches:
      - main
    paths-ignore:
      - renovate.json
      - "**.md"
      - Dockerfile

jobs:
  mypy:
    runs-on: ubuntu-24.04
    steps:
        - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        - name: "Set up environment"
          uses: packetcoders/action-setup-cache-python-poetry@0d0be5577b30d85f3fa2d93a4beeda149520f120 # v1.2.0
          with:
            # renovate: datasource=python-version depName=python versioning=python
            python-version: "3.13.3"
            # renovate: datasource=pypi depName=poetry versioning=pep440
            poetry-version: "2.5.1"
            install-args: --all-extras
        - name: Install root
          run: poetry run pip install -e . --no-deps
        - run: |
            poetry run mypy app
  test:
    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo:9
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: 12345
          MONGODUMP_DIR: /mongodumps
        volumes:
          - ${{ github.workspace }}/mongodumps:/mongodumps
        ports:
          - 27017:27017
        options: --name mongo
    defaults:
      run:
        working-directory: "src"

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        path: src
    - name: "Set up environment"
      uses: jvansanten/action-setup-cache-python-poetry@4eb3435d85a91eb2ab47d273f31f00b873389f51 # working-directory
      with:
        # renovate: datasource=python-version depName=python versioning=python
        python-version: "3.13.3"
        # renovate: datasource=pypi depName=poetry versioning=pep440
        poetry-version: "2.5.1"
        install-args: --all-extras
        working-directory: src
    - name: Install root
      run: poetry run pip install -e . --no-deps
    - name: Populate mongodb data
      run: |
        sudo mkdir -p ${{ github.workspace }}/mongodumps
        sudo cp -r tests/test-data/minimongodumps/* ${{ github.workspace }}/mongodumps/
    - name: "Populate test catalog"
      uses: docker://docker
      with:
        args: >
          docker exec mongo /mongodumps/restore.sh
    - name: Start uvicorn server
      run: |
        export ROOT_PATH=/api/catalogmatch
        poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        UVICORN_PID=$!
        echo "UVICORN_PID=$UVICORN_PID" >> $GITHUB_ENV
        # Wait for server to start
        sleep 3
    - name: Test with pytest
      run: |
        poetry run pytest tests --integration
      env:
        CATALOGSERVER_URI: http://localhost:8000/api/catalogmatch
        MONGO_URI: mongodb://root:12345@localhost:27017
    - name: Stop uvicorn server
      if: always()
      run: kill ${UVICORN_PID} || true
