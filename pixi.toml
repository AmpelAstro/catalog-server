# Pixi configuration for catalog-server
# Uses conda-forge to provide h5py with ROS3 VFD support
# catsHTM is vendored locally in app/catsHTM/ with S3 modifications

[workspace]
name = "catalog-server"
version = "0.1.0"
description = "Catalog matching service with S3-backed CATSHTM2 support"
authors = ["DESY Team <team@desy.de>"]
channels = ["conda-forge"]
platforms = ["osx-arm64","linux-aarch64","linux-64"]

# ============================================================================
# Runtime Dependencies
# ============================================================================
[dependencies]
python = "3.12.*"
fastapi = ">=0.95.2,<1.0"
uvicorn = ">=0.22.0"
pydantic = ">=2.0,<3.0"
pydantic-settings = ">=2.0,<3.0"
motor = ">=3.1.2,<4.0"
astropy = ">=5.3,<6.0"
scipy = ">=1.10.1,<2.0"
numpy = ">=1.24.0,<2.0"
# CRITICAL: h5py from conda-forge has ROS3 VFD support compiled in
h5py = ">=3.9,<4.0"
# Required by catsHTM for loading .mat files
hdf5storage = "*"
# Provides distutils for hdf5storage
setuptools = "*"
httpx = ">=0.24.1,<1.0"

# ============================================================================
# Development Dependencies
# ============================================================================
[feature.dev]

[feature.dev.dependencies]
pytest = ">=7.4.0,<8.0"
pytest-asyncio = ">=0.21.0,<0.22.0"
ruff = "*"
mypy = "*"
pyright = "*"
black = "*"
mongomock = ">=4.3.0,<5"

# ============================================================================
# PyPI Dependencies (packages not on conda-forge)
# ============================================================================
[pypi-dependencies]
testcontainers = ">=3.7.0,<4.0"
extcats = ">=2.5.0,<3.0"

# ============================================================================
# Environments
# ============================================================================
[environments]
dev = { features = ["dev"] }

# ============================================================================
# Tasks
# ============================================================================
[tasks]
start = "uvicorn app.main:app --reload --port 8080"
start-prod = "uvicorn app.main:app --host 0.0.0.0 --port 8080"
test = { cmd = "pytest tests/ -v", env = { PYTHONPATH = "." } }
test-unit = { cmd = "pytest tests/ -v -m 'not integration'", env = { PYTHONPATH = "." } }
test-s3 = { cmd = "pytest tests/test_s3_catshtm2.py -v --integration", env = { PYTHONPATH = "." } }
lint = "ruff check . && mypy ."
format = "black ."
