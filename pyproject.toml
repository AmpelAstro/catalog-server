[tool.poetry]
name = "app"
version = "2.0.0"
description = "catalog-server provides cone searches against extcats and catsHTM catalogs via a REST API. It is strictly read-only, and safe to expose to anonymous users with appropriate rate-limiting."
authors = ["Jakob van Santen <jvansanten@gmail.com>"]
license = "BSD-2-Clause"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4"
fastapi = "^0.162.0"
catsHTM = {path = "vendor/github.com/AmpelAstro/catsHTM"}
# catsHTM secretly depends on pkg_resources via hdf5storage
setuptools = {version = "*", python = ">=3.12"}
extcats = "^2.5.0"
uvicorn = {version="^0.54.0", optional=true}
gunicorn = {version="^26.0.0", optional=true}
pydantic-settings = "^2.5.2"

[tool.poetry.extras]
asgi = ["uvicorn", "gunicorn"]

[tool.poetry.group.dev.dependencies]
httpx = "^0.28.1"
mongomock = "^4.3.0"
mypy = "^2.4.1"
nest-asyncio = "^1.6.0"
pytest = "^9.0.0"
pytest-asyncio = "^1.4.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint.per-file-ignores]
# catsHTM is a vendored upstream package (see the catsHTM dependency above) whose
# public module names are load-bearing: the app imports `catsHTM.script`,
# `catsHTM.params`, etc., and script.py does `from . import class_HDF5`. The names
# cannot be changed without breaking every import, so N999 is not actionable here.
"vendor/**" = ["N999"]
# cone_search tries scipy.io.loadmat and falls back to hdf5storage.loadmat for
# MATLAB v7.3 (HDF5) files. The fallback is deliberately a catch-all: loadmat
# raises a mix of ValueError/NotImplementedError/OSError depending on the file,
# so narrowing the handler would drop the fallback for unanticipated failures.
"vendor/github.com/AmpelAstro/catsHTM/catsHTM/script.py" = ["BLE001"]

[tool.pyright]
# Analyze against the Poetry-managed virtualenv instead of the globally
# installed interpreter, so third-party stubs (pydantic, fastapi, ...) come
# from the pinned dependencies.
venvPath = "."
venv = ".venv"
# The globally installed pyright cannot infer the interpreter version from the
# venv (it falls back to a bogus future version), so pin it to match pyproject.
pythonVersion = "3.12"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--showlocals -r a"
filterwarnings = [
    "error",
    # triggered by hdf5storage
    "default:pkg_resources is deprecated:DeprecationWarning",
    # triggered by hdf5storage via setuptools v84+
    "default:distutils Version classes are deprecated:DeprecationWarning",
    # Demote resource warnings to avoid treating unclosed resources as errors
    "default::ResourceWarning",
    # Demote pytest unraisable exception warnings
    "default::pytest.PytestUnraisableExceptionWarning",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
