[project]
name = "app"
description = "catalog-server provides cone searches against extcats and catsHTM catalogs via a REST API. It is strictly read-only, and safe to expose to anonymous users with appropriate rate-limiting."
license = "BSD-2-Clause"
version = "2.0.0"
readme = "README.md"
authors = [
    {name = "Jakob van Santen",email = "jakob.van.santen@desy.de"},
]
requires-python = '>=3.10,<4'

[tool.poetry.dependencies]
python = ">=3.10,<4"

[tool.ruff.lint.pep8-naming]
# catsHTM and class_HDF5 are load-bearing upstream module names: the app imports
# `catsHTM.script`/`catsHTM.params`/`catsHTM.cone_search` and script.py does
# `from . import class_HDF5`. Renaming them would break every import and diverge
# from upstream, so accept the names rather than disabling N999.
ignore-names = ["catsHTM", "class_HDF5"]

[tool.pyright]
# Analyze against the Poetry-managed virtualenv instead of the globally
# installed interpreter, so third-party stubs (pydantic, fastapi, ...) come
# from the pinned dependencies.
venvPath = "."
venv = ".pixi/envs/dev"
# The globally installed pyright cannot infer the interpreter version from the
# venv (it falls back to a bogus future version), so pin it to match pyproject.
pythonVersion = "3.15"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--showlocals"
markers = [
    "integration: mark tests as requiring Docker containers",
    "integration_s3: mark tests as requiring h5py with ROS3 VFD support",
]
filterwarnings = [
    "error",
    # triggered by hdf5storage
    "default:pkg_resources is deprecated:DeprecationWarning",
    # triggered by hdf5storage via setuptools v84+
    "default:distutils Version classes are deprecated:DeprecationWarning",
    # Demote resource warnings to avoid treating unclosed resources as errors
    "default::ResourceWarning",
    # Demote pytest unraisable exception warnings
    "default::pytest.PytestUnraisableExceptionWarning",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# catsHTM is now vendored locally in app/catsHTM/ with S3 modifications
# setuptools is needed for pkg_resources via hdf5storage
